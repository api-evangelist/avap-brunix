note: >-
  Replaces the 2026-05-04 scaffold, which carried invented tiers and TBD prices. Every figure below is
  read verbatim from the provider's own published pricing page. avap.ai renders client-side and serves
  a byte-identical HTML shell on every route, so the values were read out of the page's own JavaScript
  bundle (https://avap.ai/js/bundle.3db876893392bbc3ca0a.min.js) — the same source the browser renders
  from — rather than from the shell. AVAP BRUNIX is not sold standalone: it is a capability inside AVAP
  Cloud and is named explicitly as an inclusion of the AVAP Neural Collaborative Edition seat. The
  plans recorded here are therefore the plans a buyer actually purchases to get Brunix.
tags:
