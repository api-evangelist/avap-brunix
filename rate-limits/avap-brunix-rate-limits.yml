note: >-
  Replaces the 2026-05-04 scaffold, which asserted per-tier request rates and X-RateLimit-* response
  headers that AVAP has never published. AVAP publishes no rate limits and no throttling response
  contract anywhere reachable: the pricing page meters REQUEST VOLUME ($95 for the first million, $25
  per additional million) but states no requests-per-second or per-minute ceiling, no burst allowance,
  no 429 semantics and no rate-limit response headers; and the documentation portal that would carry a
  reference (alexandria.avapframework.com) returned HTTP 503 on 2026-09-04. This is an honest zero, not
  an unchecked one.
